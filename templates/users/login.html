{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="flex items-center justify-center min-h-screen px-4">
    <div class="card w-full max-w-md bg-[#252525] shadow-xl rounded-lg p-8 border border-gray-700">
        <!-- ✅ Heading -->
        <h2 class="text-3xl font-bold text-orange-500 text-center">Welcome Back</h2>
        <p class="text-gray-400 text-center mt-1">Login to continue</p>

        <!-- ✅ Login Form -->
        <form method="post" class="mt-6">
            {% csrf_token %}

            <!-- ✅ Username Input -->
            <div class="mb-4">
                <label class="block text-gray-300 font-semibold">Username</label>
                <div class="relative">
                    <input type="text" name="username" placeholder="Enter your username"
                           class="w-full px-4 py-3 border border-gray-600 rounded-lg 
                                  focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 
                                  transition duration-300 pl-10 bg-[#1E1E1E] text-gray-200" required>
                    <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-orange-400" 
                         xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" 
                         stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16 12H8m8-4H8m8 8H8"></path>
                    </svg>
                </div>
            </div>

            <!-- ✅ Password Input with Eye Toggle -->
            <div class="mb-4">
                <label class="block text-gray-300 font-semibold">Password</label>
                <div class="relative">
                    <input type="password" name="password" id="passwordInput" placeholder="Enter your password"
                           class="w-full px-4 py-3 border border-gray-600 rounded-lg 
                                  focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 
                                  transition duration-300 pr-10 bg-[#1E1E1E] text-gray-200" required>
                    <button type="button" id="togglePassword" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-orange-400">
                        👁️
                    </button>
                </div>
            </div>

            <!-- ✅ Login Button -->
            <button class="w-full px-6 py-3 text-white text-lg font-semibold bg-orange-600 
                           hover:bg-orange-700 rounded-lg shadow-lg transition">
                Login
            </button>
        </form>

        <!-- ✅ Forgot Password & Register Links -->
        <div class="mt-4 text-center">
            <a href="{% url 'password_reset' %}" class="text-orange-500 hover:underline font-semibold">
                Forgot Password?
            </a>
        </div>

        <div class="mt-3 text-center text-gray-400">
            Not have an account?
            <a href="{% url 'register' %}" class="text-orange-500 hover:underline font-semibold">Register</a>
        </div>
    </div>
</div>

<!-- ✅ JavaScript for Password Toggle -->
<script>
    document.getElementById("togglePassword").addEventListener("click", function() {
        var passwordInput = document.getElementById("passwordInput");
        passwordInput.type = passwordInput.type === "password" ? "text" : "password";
    });
</script>
{% endblock %}
